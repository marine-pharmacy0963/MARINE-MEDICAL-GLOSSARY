short{font-weight:700;margin:14px 0;color:#e7f8fb}.mdetail{line-height:1.8;white-space:pre-wrap;color:#d9edf3}.relatedPublic{margin-top:20px;padding-top:15px;border-top:1px solid #245066}.relatedPublic h4{margin:0 0 9px}.relatedLink{display:block;text-decoration:none;color:#fff;background:#087d91;border-radius:12px;padding:12px 14px;margin-top:8px;font-weight:800}.relatedType{font-size:11px;opacity:.75;margin-left:6px}.close{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:1px solid #477386;background:#092331;color:#fff;font-size:22px;z-index:2}.foot{text-align:center;color:#8aa9b6;font-size:11px;padding:30px 12px}.loginbtn{position:fixed;right:12px;bottom:12px;border:1px solid #245066;border-radius:999px;padding:9px 12px;background:#0b2635;color:#fff;text-decoration:none}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.term{font-size:16px}.wrap{padding:10px}}</style></head><body><header><h1 id="ttl"></h1><div class="sub" id="sub"></div></header><main class="wrap"><div class="tools"><input class="search" id="q" placeholder="用語・病気・薬・検査などを検索"><div class="toolrow"><div class="cats" id="cats"></div><select class="sort" id="sort"><option value="manual">おすすめ順</option><option value="kana">五十音順</option><option value="term">用語名順</option><option value="category">カテゴリ順</option></select></div></div><div class="grid" id="cards"></div><div class="foot" id="foot"></div></main><div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="modalbox"><button class="close" onclick="closeM()">×</button><div id="modalContent"></div></div></div><script>const D={"settings":{"title":"医療用語集","sub":"薬・病気・検査・服用方法をやさしく確認","background":"","allowSave":false,"showLogin":false,"maxPx":1200,"quality":0.78},"items":[{"id":"ythejpsw","term":"食前","reading":"しょくぜん","category":"服用時点","short":"食事の約30分前を目安に服用します。","detail":"一般に、食事を始める約30分前を目安とする服用時点です。薬によって具体的な指示が異なる場合があるため、薬袋や医療者からの説明を優先してください。","tags":"薬,飲み方","image":"","public":true,"related":[]},{"id":"e9xwz5lm","term":"食後","reading":"しょくご","category":"服用時点","short":"食事が終わってから約30分以内を目安に服用します。","detail":"一般に、食事が終わってから約30分以内を目安とする服用時点です。必ず30分待つという意味ではありません。","tags":"薬,飲み方","image":"","public":true,"related":[]},{"id":"y3dmg4yy","term":"食間","reading":"しょっかん","category":"服用時点","short":"食事と食事の間に服用します。食事中という意味ではありません。","detail":"一般に食後約2時間を目安とします。「食事の最中」ではない点がよく誤解されます。","tags":"薬,飲み方","image":"","public":true,"related":[]},{"id":"pron5tpo","term":"高血圧","reading":"こうけつあつ","category":"病気","short":"血圧が高い状態が続く病気です。","detail":"高い血圧が続くと、血管や心臓などに負担がかかります。診断や目標値は年齢、合併症、測定方法などで異なるため、個別の指示を確認します。","tags":"循環器,血圧","image":"","public":true,"related":[]},{"id":"sqq7w4az","term":"HbA1c","reading":"ヘモグロビンエーワンシー","category":"検査値","short":"過去1〜2か月程度の血糖状態を反映する指標です。","detail":"赤血球中のヘモグロビンに糖が結びついた割合を示し、糖尿病の診断や治療経過の確認に用いられます。値の解釈は個人の状態によって異なります。","tags":"糖尿病,血糖,検査","image":"","public":true,"related":[]},{"id":"s0plahuq","term":"起床時","reading":"きしょうじ","category":"服用時点","short":"朝、起きてすぐに服用する指示です。","detail":"薬によっては、起床後すぐに十分な水で服用し、その後しばらく飲食や横になることを避ける必要があります。薬ごとの指示を確認してください。","tags":"薬,飲み方","image":"","public":true,"related":[]},{"id":"z1ie3gqp","term":"食直前","reading":"しょくちょくぜん","category":"服用時点","short":"食事を始める直前に服用します。","detail":"食事の直前に服用する指示です。薬によっては食事開始との時間関係が効果に影響するため、具体的な指示を守ります。","tags":"薬,飲み方","image":"","public":true,"related":[]},{"id":"yiumqj65","term":"食直後","reading":"しょくちょくご","category":"服用時点","short":"食事が終わった直後に服用します。","detail":"食事終了後すぐに服用する指示です。「食後」と区別して指示されることがあります。","tags":"薬,飲み方","image":"","public":true,"related":[]},{"id":"fjn4b6si","term":"就寝前","reading":"しゅうしんまえ","category":"服用時点","short":"寝る前に服用する指示です。","detail":"一般に就寝前に服用します。眠気が出る薬などでは、服用後の行動について注意が必要な場合があります。","tags":"薬,飲み方","image":"","public":true,"related":[]},{"id":"bhaze4he","term":"頓服","reading":"とんぷく","category":"服用時点","short":"症状がある時など、必要な時に服用します。","detail":"決まった時刻に毎日服用するのではなく、痛みや発熱など指定された症状がある時に服用します。1回量、服用間隔、1日の上限回数を確認してください。","tags":"薬,飲み方","image":"","public":true,"related":[]},{"id":"npjwzeon","term":"内服薬","reading":"ないふくやく","category":"薬・剤形","short":"口から飲んで使う薬です。","detail":"錠剤、カプセル剤、散剤、液剤など、口から服用して使用する薬の総称です。","tags":"薬,剤形","image":"","public":true,"related":[]},{"id":"le2f1gpm","term":"錠剤","reading":"じょうざい","category":"薬・剤形","short":"薬の成分を一定の形に固めた剤形です。","detail":"飲みやすさや成分の安定性などを考えて作られています。割ったり砕いたりできない錠剤もあります。","tags":"薬,剤形","image":"","public":true,"related":[]},{"id":"0m847e67","term":"カプセル剤","reading":"かぷせるざい","category":"薬・剤形","short":"薬をカプセルに入れた剤形です。","detail":"カプセルの中に粉末、顆粒、液体などが入っています。開けて服用できない製品もあるため確認が必要です。","tags":"薬,剤形","image":"","public":true,"related":[]},{"id":"8pa5etn4","term":"散剤","reading":"さんざい","category":"薬・剤形","short":"粉末状の薬です。","detail":"いわゆる粉薬です。複数の薬を混ぜて調剤することもあります。","tags":"薬,粉薬,剤形","image":"","public":true,"related":[]},{"id":"56879vcp","term":"OD錠","reading":"おーでぃーじょう","category":"薬・剤形","short":"口の中で崩れやすく作られた錠剤です。","detail":"口腔内崩壊錠のことです。水なしで服用できる製品もありますが、薬ごとの注意事項を確認します。","tags":"薬,剤形","image":"","public":true,"related":[]},{"id":"8b84j8q4","term":"貼付剤","reading":"ちょうふざい","category":"薬・剤形","short":"皮膚に貼って使う薬です。","detail":"局所に作用するものと、皮膚から吸収され全身に作用するものがあります。貼る場所や交換時期を確認します。","tags":"薬,外用薬","image":"","public":true,"related":[]},{"id":"ahrwqejh","term":"坐剤","reading":"ざざい","category":"薬・剤形","short":"肛門などから挿入して使う薬です。","detail":"体温で溶けるなどして成分が吸収されます。挿入方法や保管方法に注意が必要な製品があります。","tags":"薬,外用薬","image":"","public":true,"related":[]},{"id":"btgfpdl7","term":"高血糖","reading":"こうけっとう","category":"症状","short":"血液中のブドウ糖が多い状態です。","detail":"高血糖が続く場合、口渇、多尿、倦怠感などがみられることがあります。著しい高血糖では早めの医療相談が必要です。","tags":"糖尿病,血糖","image":"","public":true,"related":[]},{"id":"45l0ymq9","term":"低血糖","reading":"ていけっとう","category":"症状","short":"血糖値が必要以上に低下した状態です。","detail":"冷や汗、動悸、手の震え、強い空腹感などが起こることがあります。糖尿病治療薬を使用している人は、対処方法をあらかじめ確認しておくことが大切です。","tags":"糖尿病,血糖","image":"","public":true,"related":[]},{"id":"s0vh4xuq","term":"糖尿病","reading":"とうにょうびょう","category":"病気","short":"血糖値が高い状態が続く病気です。","detail":"インスリンの作用不足などにより慢性的な高血糖が続く病気です。治療は食事、運動、薬物療法などを組み合わせて行います。","tags":"糖尿病,生活習慣病","image":"","public":true,"related":[]},{"id":"yzq2ex9q","term":"脂質異常症","reading":"ししついじょうしょう","category":"病気","short":"血液中の脂質の値に異常がある状態です。","detail":"LDLコレステロールや中性脂肪が高い、HDLコレステロールが低いなどの状態を含みます。動脈硬化との関連があります。","tags":"脂質,生活習慣病","image":"","public":true,"related":[]},{"id":"zuh5lmwt","term":"心不全","reading":"しんふぜん","category":"病気","short":"心臓の働きが低下し、全身に必要な血液を送りにくくなった状態です。","detail":"息切れ、むくみ、体重増加などがみられることがあります。急な悪化が疑われる場合は医療機関への相談が必要です。","tags":"心臓,循環器","image":"","public":true,"related":[]},{"id":"ty3mqcky","term":"便秘","reading":"べんぴ","category":"症状","short":"便が出にくい、回数が少ないなどの状態です。","detail":"排便回数だけでなく、便が硬い、強くいきむ、残便感があるなども便秘の症状に含まれます。","tags":"消化器,排便","image":"","public":true,"related":[]},{"id":"yncj0nl4","term":"下痢","reading":"げり","category":"症状","short":"水分の多い便が繰り返し出る状態です。","detail":"感染症、食事、薬などさまざまな原因があります。強い脱水、血便、高熱などがある場合は医療相談が必要です。","tags":"消化器,排便","image":"","public":true,"related":[]},{"id":"bv4cx181","term":"浮腫","reading":"ふしゅ","category":"症状","short":"体の組織に水分がたまり、むくんだ状態です。","detail":"足などに起こりやすく、心臓、腎臓、肝臓、静脈、薬などさまざまな原因があります。","tags":"むくみ,症状","image":"","public":true,"related":[]},{"id":"ql7s0sed","term":"めまい","reading":"めまい","category":"症状","short":"自分や周囲が動いて感じるなどの症状です。","detail":"回転感、ふわふわ感、立ちくらみなど表現はさまざまです。耳、脳、循環、薬など複数の原因が考えられます。","tags":"ふらつき,症状","image":"","public":true,"related":[]},{"id":"2bdmyzk7","term":"血圧","reading":"けつあつ","category":"検査値","short":"血液が血管の壁を押す圧力です。","detail":"一般に収縮期血圧と拡張期血圧で表します。家庭と医療機関では測定環境が異なるため、評価基準も異なる場合があります。","tags":"循環器,血圧","image":"","public":true,"related":[]},{"id":"evrw9fd6","term":"収縮期血圧","reading":"しゅうしゅくきけつあつ","category":"検査値","short":"心臓が収縮した時の血圧です。","detail":"血圧測定で上の血圧と呼ばれることが多い値です。","tags":"血圧,検査","image":"","public":true,"related":[]},{"id":"r6mo6l6g","term":"拡張期血圧","reading":"かくちょうきけつあつ","category":"検査値","short":"心臓が拡張した時の血圧です。","detail":"血圧測定で下の血圧と呼ばれることが多い値です。","tags":"血圧,検査","image":"","public":true,"related":[]},{"id":"upigjfx9","term":"血糖値","reading":"けっとうち","category":"検査値","short":"血液中のブドウ糖の濃度を示す値です。","detail":"食事の影響を受けるため、空腹時や食後など測定条件と合わせて評価します。","tags":"糖尿病,血糖,検査","image":"","public":true,"related":[]},{"id":"cm706xny","term":"LDLコレステロール","reading":"えるでぃーえるこれすてろーる","category":"検査値","short":"動脈硬化との関連が重視されるコレステロールの指標です。","detail":"一般に「悪玉コレステロール」と呼ばれます。目標値は心血管リスクなどによって異なります。","tags":"脂質,検査","image":"","public":true,"related":[]},{"id":"b9kahlcp","term":"HDLコレステロール","reading":"えいちでぃーえるこれすてろーる","category":"検査値","short":"末梢からコレステロールを回収する働きに関わる指標です。","detail":"一般に「善玉コレステロール」と呼ばれます。脂質状態を評価する指標の一つです。","tags":"脂質,検査","image":"","public":true,"related":[]},{"id":"dcf1p5kj","term":"中性脂肪","reading":"ちゅうせいしぼう","category":"検査値","short":"体のエネルギー源となる脂質の一種です。","detail":"トリグリセリドとも呼ばれます。食事や飲酒などの影響を受けやすい検査値です。","tags":"脂質,検査","image":"","public":true,"related":[]},{"id":"8d9r8tsd","term":"クレアチニン","reading":"くれあちにん","category":"検査値","short":"腎機能を評価する時に使われる血液検査項目です。","detail":"筋肉由来の老廃物で、腎臓から排泄されます。年齢や筋肉量などの影響も受けるため単独ではなく総合的に評価します。","tags":"腎臓,検査","image":"","public":true,"related":[]},{"id":"4qnl7o4z","term":"eGFR","reading":"いーじーえふあーる","category":"検査値","short":"腎臓が血液をろ過する能力を推定した値です。","detail":"血清クレアチニン、年齢、性別などから推算され、腎機能の評価に用いられます。","tags":"腎臓,検査","image":"","public":true,"related":[]},{"id":"bcqv4hph","term":"BMI","reading":"びーえむあい","category":"検査値","short":"身長と体重から計算する体格の指標です。","detail":"体重kgを身長mの2乗で割って求めます。体脂肪量そのものを直接測る指標ではありません。","tags":"体重,検査","image":"","public":true,"related":[]},{"id":"qrmn5wei","term":"ジェネリック医薬品","reading":"じぇねりっくいやくひん","category":"医療制度","short":"先発医薬品と同じ有効成分を含む後発医薬品です。","detail":"先発医薬品の特許期間などが終了した後に承認される医薬品です。添加剤や形状などが異なる場合があります。","tags":"薬,制度","image":"","public":true,"related":[]},{"id":"o9z5f31i","term":"お薬手帳","reading":"おくすりてちょう","category":"医療制度","short":"使用している薬の情報を記録する手帳です。","detail":"処方薬だけでなく、市販薬やサプリメント、アレルギー歴などを記録しておくと、医療機関や薬局で薬の重複や相互作用を確認する助けになります。","tags":"薬局,薬","image":"","public":true,"related":[]},{"id":"xmdeo5bx","term":"かかりつけ薬剤師","reading":"かかりつけやくざいし","category":"医療制度","short":"薬の使用状況を継続して把握し、相談に対応する薬剤師です。","de
